<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">logscope Linux log analyzer</title>
  <desc id="desc">Terminal dashboard showing log retention and disk usage diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34d399" stop-opacity=".8"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="#020617"/>
  <rect x="36" y="36" width="1128" height="608" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="36" y="36" width="1128" height="72" rx="24" fill="#1e293b"/>
  <path d="M36 84h1128" stroke="#334155" stroke-width="2"/>
  <circle cx="78" cy="72" r="9" fill="#fb7185"/>
  <circle cx="108" cy="72" r="9" fill="#fbbf24"/>
  <circle cx="138" cy="72" r="9" fill="#34d399"/>
  <text x="600" y="79" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">logscope — system log intelligence</text>
  <text x="92" y="174" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">$ sudo python main.py</text>
  <text x="92" y="224" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Scanning /var/log · 453 files discovered · 451 days covered</text>
  <rect x="92" y="262" width="1016" height="1" fill="url(#line)"/>
  <text x="92" y="318" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">SERVICE REPORT</text>
  <text x="92" y="366" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">Squid Proxy</text>
  <text x="360" y="366" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">✓ found</text>
  <text x="92" y="408" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">Active  3    Rotated  450    Compressed  445</text>
  <rect x="92" y="444" width="690" height="64" rx="12" fill="#0f1d2d" stroke="#334155"/>
  <text x="116" y="473" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">TOTAL DISK</text>
  <text x="116" y="496" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">8.3 GB</text>
  <text x="350" y="473" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">COVERAGE</text>
  <text x="350" y="496" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">451 days</text>
  <text x="584" y="473" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">STATUS</text>
  <text x="584" y="496" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">healthy</text>
  <text x="92" y="564" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">✓ Retención anual detectada</text>
  <text x="92" y="604" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">⚠ Rotación dual detectada</text>
</svg>
