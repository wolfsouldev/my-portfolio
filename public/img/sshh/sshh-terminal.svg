<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">sshh Secure SSH Credential Manager</title>
  <desc id="desc">Terminal interface showing an encrypted SSH credential vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00add8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00add8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="#020617"/>
  <rect x="36" y="36" width="1128" height="608" rx="24" fill="url(#bg)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="36" y="36" width="1128" height="72" rx="24" fill="#172033"/>
  <path d="M36 84h1128" stroke="#334155" stroke-width="2"/>
  <circle cx="78" cy="72" r="9" fill="#fb7185"/>
  <circle cx="108" cy="72" r="9" fill="#fbbf24"/>
  <circle cx="138" cy="72" r="9" fill="#34d399"/>
  <text x="600" y="79" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">sshh — secure credential manager</text>
  <text x="92" y="174" fill="#00add8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">$ sshh</text>
  <text x="200" y="174" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">interactive</text>
  <text x="92" y="224" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Encrypted vault ready · 03 saved connections</text>
  <rect x="92" y="262" width="1016" height="1" fill="url(#glow)"/>
  <text x="92" y="318" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">VAULT STATUS</text>
  <text x="92" y="365" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="29">●  protected</text>
  <text x="92" y="406" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">AES-256-GCM  /  Argon2id  /  memory-only decryption</text>
  <g transform="translate(874 300)">
    <rect x="0" y="42" width="132" height="100" rx="18" fill="#0f2740" stroke="#00add8" stroke-width="3"/>
    <path d="M31 42V28c0-22 16-38 35-38s35 16 35 38v14" fill="none" stroke="#00add8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="66" cy="88" r="12" fill="#fb923c"/>
    <path d="M66 99v18" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="92" y="512" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">[1] production   [2] staging   [3] personal</text>
  <text x="92" y="574" fill="#00add8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">›</text>
  <text x="118" y="574" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Choose a connection</text>
  <rect x="92" y="604" width="260" height="4" rx="2" fill="#fb923c"/>
</svg>
